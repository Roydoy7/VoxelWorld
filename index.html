<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方块世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',monospace;user-select:none}
#c{display:block}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:10;width:24px;height:24px}
#cross::before,#cross::after{content:'';position:absolute;background:rgba(255,255,255,.85);border-radius:1px;box-shadow:0 0 2px rgba(0,0,0,.5)}
#cross::before{width:2px;height:20px;top:2px;left:11px}
#cross::after{width:20px;height:2px;top:11px;left:2px}
#ui{position:fixed;top:8px;left:8px;color:#fff;font-size:12px;z-index:10;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:6px;line-height:1.7;pointer-events:none;backdrop-filter:blur(4px);display:none}
#hp{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:2px}
.ht{width:14px;height:13px;background:#e22;clip-path:polygon(50% 100%,0% 35%,0% 15%,25% 0%,50% 15%,75% 0%,100% 15%,100% 35%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}.ht.x{background:#333;filter:none}
.ht.half{background:linear-gradient(90deg,#e22 50%,#333 50%)}
#hunger{position:fixed;bottom:60px;left:calc(50% + 82px);z-index:10;display:flex;gap:2px;flex-direction:row-reverse}
.hg{width:13px;height:12px;background:#a67c32;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}.hg.x{background:#333;filter:none}
.hg.half{background:linear-gradient(90deg,#a67c32 50%,#333 50%)}
#xpbar{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);width:182px;height:5px;z-index:10;background:rgba(0,0,0,.5);border-radius:2px}
#xpfill{height:100%;background:#7dff2a;border-radius:2px;width:0%;transition:width .2s}
#xplvl{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:11;color:#7dff2a;font-size:11px;font-weight:bold;text-shadow:0 1px 2px #000;pointer-events:none}
#bar{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:2px;padding:4px 6px;background:rgba(0,0,0,.6);border-radius:6px;backdrop-filter:blur(4px)}
.sl{width:44px;height:44px;border:2px solid rgba(255,255,255,.15);background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;border-radius:4px;position:relative;cursor:pointer;transition:border-color .15s}
.sl.on{border-color:rgba(255,255,255,.9);background:rgba(255,255,255,.1)}.sl canvas{width:36px;height:36px;image-rendering:pixelated}
.sn{position:absolute;top:1px;left:3px;color:rgba(255,255,255,.35);font-size:9px;font-weight:700}
.sq{position:absolute;bottom:1px;right:3px;color:#fff;font-size:9px;font-weight:700;text-shadow:0 1px 2px #000}
#inv{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:20;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#ipanel{background:rgba(80,80,80,.85);padding:16px;border-radius:8px;display:flex;gap:16px;flex-direction:row;max-height:85vh;overflow-y:auto}
#ileft{display:flex;flex-direction:column;gap:8px}
#igrid{display:grid;grid-template-columns:repeat(9,42px);gap:3px}
#iright{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;background:rgba(0,0,0,.2);border-radius:6px;min-width:140px}
#icraft{display:grid;grid-template-columns:repeat(2,42px);gap:3px}
#icout{width:46px;height:46px;background:rgba(40,40,40,.9);border:2px solid #6a6;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}
#icout canvas{width:34px;height:34px;image-rendering:pixelated}
#icout:hover{border-color:#8f8}
.ic{width:42px;height:42px;background:rgba(60,60,60,.9);border:2px solid rgba(80,80,80,.8);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border-radius:4px;transition:border-color .15s}
.ic:hover{border-color:#ff0}.ic canvas{width:30px;height:30px;image-rendering:pixelated}
.ic .nm{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:#fff;background:rgba(0,0,0,.85);padding:2px 5px;border-radius:3px;white-space:nowrap;display:none;z-index:5}.ic:hover .nm{display:block}
#craft{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:21;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#cpanel{background:rgba(80,80,80,.85);padding:20px;border-radius:8px;display:flex;gap:16px;align-items:center}
#cgrid{display:grid;grid-template-columns:repeat(3,46px);gap:3px}
.cs{width:46px;height:46px;background:rgba(60,60,60,.9);border:2px solid rgba(80,80,80,.8);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px}.cs:hover{border-color:#ff0}
.cs canvas{width:34px;height:34px;image-rendering:pixelated}
#cout{width:50px;height:50px;background:rgba(40,40,40,.9);border:2px solid #6a6;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;margin-left:20px}
#cout canvas{width:38px;height:38px;image-rendering:pixelated}
#load{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;background:linear-gradient(135deg,#0a0f1a,#1a1520);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#load h1{font-size:36px;color:#5ec;margin-bottom:24px;text-shadow:0 0 20px rgba(94,204,170,.3)}
#lbar{width:280px;height:16px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
#lfill{width:0%;height:100%;background:linear-gradient(90deg,#2a8,#4c8);transition:width .15s;border-radius:8px}
#ltxt{margin-top:12px;font-size:12px;color:rgba(255,255,255,.5)}
#dmg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:15;border:8px solid transparent;transition:border-color .1s}
#die{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(120,0,0,.65);backdrop-filter:blur(4px)}
#die h2{color:#fff;font-size:36px;margin-bottom:20px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#die button{padding:12px 36px;font-size:15px;background:rgba(80,80,80,.8);color:#fff;border:2px solid rgba(255,255,255,.3);border-radius:6px;cursor:pointer;transition:all .2s}
#die button:hover{background:rgba(120,120,120,.8);border-color:rgba(255,255,255,.5)}
#alert2{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%);color:#ff4;font-size:16px;font-weight:bold;z-index:10;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#help{position:fixed;top:8px;right:8px;color:rgba(255,255,255,.55);font-size:11px;z-index:10;background:rgba(0,0,0,.45);padding:8px 10px;border-radius:6px;line-height:1.9;pointer-events:none;backdrop-filter:blur(4px)}
#weather{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 2s}
#modesel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:linear-gradient(135deg,#0a1a0a,#1a2520);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff}
#modesel h1{font-size:32px;color:#5ec;margin-bottom:10px;text-shadow:0 0 20px rgba(94,204,170,.3)}
#modesel p{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:10px}
.mbtn{padding:16px 48px;font-size:17px;border:2px solid rgba(255,255,255,.2);border-radius:8px;cursor:pointer;color:#fff;transition:all .2s;min-width:220px;text-align:center}
.mbtn:hover{border-color:rgba(255,255,255,.6);transform:scale(1.05)}
#btn_surv{background:rgba(60,120,60,.6)}.btn_crea{background:rgba(60,60,140,.6)}

<div id="die"><h2>你死了！</h2><button onclick="RESPAWN()">重生</button></div>
<div id="inv" onclick="if(event.target===this)togInv()"><div id="ipanel"><div id="ileft"><div style="color:#fff;font-size:14px;margin-bottom:4px">🎒 背包</div><div id="igrid"></div></div><div id="iright"><div style="color:#fff;font-size:12px">⚒ 合成</div><div id="icraft"></div><div style="color:#fff;font-size:18px">↓</div><div id="icout"></div></div></div></div>

<div id="modesel"><h1>⛏ 方块世界</h1><p>选择游戏模式</p><div class="mbtn" id="btn_surv" onclick="startGame(0)">⚔ 生存模式<br><small style="opacity:.6">收集资源 合成工具 对抗怪物</small></div><div class="mbtn btn_crea" onclick="startGame(1)">✨ 创造模式<br><small style="opacity:.6">无限方块 自由飞行 无敌</small></div></div>

      if(ni===0){g.v.push(px+.5,py-.5,pz-.5,px+.5,py+.5,pz-.5,px+.5,py+.5,pz+.5,px+.5,py-.5,pz+.5);for(var q=0;q<4;q++)g.n.push(1,0,0);}
      else if(ni===1){g.v.push(px-.5,py-.5,pz+.5,px-.5,py+.5,pz+.5,px-.5,py+.5,pz-.5,px-.5,py-.5,pz-.5);for(var q=0;q<4;q++)g.n.push(-1,0,0);}
      else if(ni===2){g.v.push(px-.5,py+.5,pz-.5,px-.5,py+.5,pz+.5,px+.5,py+.5,pz+.5,px+.5,py+.5,pz-.5);for(var q=0;q<4;q++)g.n.push(0,1,0);}
      else if(ni===3){g.v.push(px-.5,py-.5,pz+.5,px-.5,py-.5,pz-.5,px+.5,py-.5,pz-.5,px+.5,py-.5,pz+.5);for(var q=0;q<4;q++)g.n.push(0,-1,0);}
      else if(ni===4){g.v.push(px+.5,py-.5,pz+.5,px+.5,py+.5,pz+.5,px-.5,py+.5,pz+.5,px-.5,py-.5,pz+.5);for(var q=0;q<4;q++)g.n.push(0,0,1);}
      else{g.v.push(px-.5,py-.5,pz-.5,px-.5,py+.5,pz-.5,px+.5,py+.5,pz-.5,px+.5,py-.5,pz-.5);for(var q=0;q<4;q++)g.n.push(0,0,-1);}
      g.u.push(0,0,0,1,1,1,1,0);
      g.f.push(vi,vi+1,vi+2,vi,vi+2,vi+3);
    }
  }
  for(var fk in geo){
    var g=geo[fk],pp=fk.split('_'),bid=+pp[0],face=pp[1];
    var bg=new THREE.BufferGeometry();
    bg.setAttribute('position',new THREE.Float32BufferAttribute(g.v,3));
    bg.setAttribute('normal',new THREE.Float32BufferAttribute(g.n,3));
    bg.setAttribute('uv',new THREE.Float32BufferAttribute(g.u,2));
    bg.setIndex(g.f);
    var mt=gMat(bid,face);if(!mt)continue;
    var ms=new THREE.Mesh(bg,mt);ms.receiveShadow=true;ms.castShadow=true;
    grp.add(ms);
  }
  scene.add(grp);CK[k]=grp;
}

function rebld(x,z){var cx=fl(x/CS),cz=fl(z/CS);bldCk(cx,cz);
  if(x%CS===0&&cx>0)bldCk(cx-1,cz);if(x%CS===CS-1)bldCk(cx+1,cz);
  if(z%CS===0&&cz>0)bldCk(cx,cz-1);if(z%CS===CS-1)bldCk(cx,cz+1);
}

async function bldInitCk(){
  var spCx=fl(WS/2/CS),spCz=fl(WS/2/CS),built=0,total=(2*RD+1)*(2*RD+1);
  for(var dx=-RD;dx<=RD;dx++)for(var dz=-RD;dz<=RD;dz++){
    if(dx*dx+dz*dz>RD*RD+2)continue;
    var nx=spCx+dx,nz=spCz+dz;
    if(nx>=0&&nz>=0&&nx<WS/CS&&nz<WS/CS){bldCk(nx,nz);built++;
      if(built%5===0){$('lfill').style.width=(50+built/total*50)+'%';await new Promise(function(r){setTimeout(r,1);});}
    }
  }
}

var arrows=[],arG=new THREE.Group();scene.add(arG);
function shoot(fx,fy,fz,tx,ty,tz,dm){
  var ddx=tx-fx,ddy=ty-fy,ddz=tz-fz,l=sq(ddx*ddx+ddy*ddy+ddz*ddz);
  if(l<.1)return;var s=16;
  var m=new THREE.Mesh(new THREE.BoxGeometry(.05,.05,.45),new THREE.MeshLambertMaterial({color:0x6B3A1A}));
  m.position.set(fx,fy,fz);m.lookAt(tx,ty,tz);m.castShadow=true;arG.add(m);
  arrows.push({m:m,x:fx,y:fy,z:fz,vx:ddx/l*s,vy:ddy/l*s+2,vz:ddz/l*s,dm:dm,l:4});
}
function updArr(dt){
  for(var i=arrows.length-1;i>=0;i--){
    var a=arrows[i];a.l-=dt;a.vy-=14*dt;
    a.x+=a.vx*dt;a.y+=a.vy*dt;a.z+=a.vz*dt;
    a.m.position.set(a.x,a.y,a.z);a.m.lookAt(a.x+a.vx,a.y+a.vy,a.z+a.vz);
    if(sq((a.x-P.x)*(a.x-P.x)+(a.y-P.y)*(a.y-P.y)+(a.z-P.z)*(a.z-P.z))<.9){hurtP(a.dm,'骷髅',a.vx,a.vz);a.l=-1;}
    if(gB(fl(a.x),fl(a.y),fl(a.z))&&gB(fl(a.x),fl(a.y),fl(a.z))!==120)a.l=-1;
    if(a.l<=0||a.y<-5){arG.remove(a.m);a.m.geometry.dispose();arrows.splice(i,1);}
  }
}

}
function updBoom(dt){
  for(var i=exps.length-1;i>=0;i--){
    var e=exps[i];e.l-=dt;e.vy-=14*dt;
    e.m.position.x+=e.vx*dt;e.m.position.y+=e.vy*dt;e.m.position.z+=e.vz*dt;
    e.m.scale.setScalar(mx(.01,e.l*2));
    if(e.l<=0){scene.remove(e.m);e.m.geometry.dispose();exps.splice(i,1);}

function cBoom(m){
  var cx2=fl(m.x),cy2=fl(m.y),cz2=fl(m.z),r=3;
  for(var dx=-r;dx<=r;dx++)for(var dy=-r;dy<=r;dy++)for(var dz=-r;dz<=r;dz++){
    if(dx*dx+dy*dy+dz*dz<=r*r){
      var id=gB(cx2+dx,cy2+dy,cz2+dz);
      if(id&&!(B[id]&&B[id].nb))sB(cx2+dx,cy2+dy,cz2+dz,0);
    }
  }
  for(var dx2=-2;dx2<=2;dx2++)for(var dz2=-2;dz2<=2;dz2++){
    var ncx=mx(0,fl((cx2+dx2*CS)/CS)),ncz=mx(0,fl((cz2+dz2*CS)/CS));
    if(ncx<WS/CS&&ncz<WS/CS)bldCk(ncx,ncz);
  }
  var d=sq((P.x-m.x)*(P.x-m.x)+(P.y-m.y)*(P.y-m.y)+(P.z-m.z)*(P.z-m.z));
  if(d<6)hurtP(fl(10*(1-d/6)+1),'苦力怕');
  boom(m.x,m.y+.5,m.z);mobG.remove(m.mesh);mobs.splice(mobs.indexOf(m),1);
}

function updMobs(dt){
  for(var i=mobs.length-1;i>=0;i--){
    var m=mobs[i];
    if(m.dead){m.dt-=dt;m.mesh.rotation.z+=dt*4;m.mesh.position.y-=dt*2.5;if(m.dt<=0){mobG.remove(m.mesh);mobs.splice(i,1);}continue;}
    var t=MT[m.type],ddx=P.x-m.x,ddz=P.z-m.z,dist=sq(ddx*ddx+ddz*ddz);
    var agg=dist<t.ag&&!P.dead&&!t.passive;
    // Passive mob flee after hit
    if(t.passive&&m.flee>0){m.flee-=dt;agg=false;
      var fang=Math.atan2(-ddx,-ddz);m.mesh.rotation.y=fang;
      var nx2=m.x+Math.sin(fang)*t.sp*2*dt,nz2=m.z+Math.cos(fang)*t.sp*2*dt;
      var gy=fGnd(nx2,nz2);if(gy>0&&ab(gy-m.y)<2){m.x=nx2;m.z=nz2;m.y=gy;}
    }
    m.wa+=dt*5;
    if(agg){
      var ang=Math.atan2(ddx,ddz);m.mesh.rotation.y=ang;
      if((!t.ra&&dist>1.5)||(t.ra&&dist<4)){
        var sp=t.ra&&dist<4?-t.sp:t.sp;
        var nx2=m.x+Math.sin(ang)*sp*dt,nz2=m.z+Math.cos(ang)*sp*dt;
        var gy=fGnd(nx2,nz2);if(gy>0&&ab(gy-m.y)<2.5){m.x=nx2;m.z=nz2;m.y=gy;}
      }
      if(!t.ra&&!t.ex&&dist<t.rg){m.acd-=dt;if(m.acd<=0){hurtP(t.dm,t.n,P.x-m.x,P.z-m.z);m.acd=1;}}
      if(t.ra&&dist>4&&dist<t.rg){m.scd-=dt;if(m.scd<=0){shoot(m.x,m.y+1.3,m.z,P.x,P.y-.2,P.z,t.dm);m.scd=2+rn();}}
      if(t.ex&&dist<t.rg){
        if(!m.fusing){m.fusing=1;m.fuse=2;}
        m.fuse-=dt;
        var flash=sin(m.fuse*12)>0;
        m.mesh.traverse(function(c){if(c.material&&c.material.emissive)c.material.emissive.setHex(flash?0xffffff:0);});
        if(m.fuse<=0){cBoom(m);continue;}
      }else if(t.ex&&m.fusing){
        m.fusing=0;m.fuse=0;
        m.mesh.traverse(function(c){if(c.material&&c.material.emissive)c.material.emissive.setHex(0);});
      }
    }else if(!t.passive||m.flee<=0){
      m.pt-=dt;
      if(m.pt<=0){m.tx=mx(3,mn(WS-3,m.x+(rn()-.5)*8));m.tz=mx(3,mn(WS-3,m.z+(rn()-.5)*8));m.pt=3+rn()*4;}
      var wdx=m.tx-m.x,wdz=m.tz-m.z,wd=sq(wdx*wdx+wdz*wdz);
      if(wd>.5){var ang2=Math.atan2(wdx,wdz);m.mesh.rotation.y=ang2;
        var nx3=m.x+Math.sin(ang2)*t.sp*.25*dt,nz3=m.z+Math.cos(ang2)*t.sp*.25*dt;
        var gy2=fGnd(nx3,nz3);if(gy2>0&&ab(gy2-m.y)<2){m.x=nx3;m.z=nz3;m.y=gy2;}}
    }
    var la=sin(m.wa)*.6;
    m.mesh.traverse(function(c){
      if(c.name==='legL'||c.name==='leg0'||c.name==='leg2')c.rotation.x=la;
      if(c.name==='legR'||c.name==='leg1'||c.name==='leg3')c.rotation.x=-la;
      if(c.name==='armL')c.rotation.x=-la*.5-PI/3;
      if(c.name==='armR')c.rotation.x=la*.5-PI/3;
    });

  }
}

function hitMob(mob,dm){

  updMobHP(mob);
  mob.mesh.traverse(function(c){if(c.material&&c.material.emissive)c.material.emissive=new THREE.Color(0xff0000);});
  setTimeout(function(){mob.mesh.traverse(function(c){if(c.material&&c.material.emissive)c.material.emissive=new THREE.Color(0);});},150);
  var t=MT[mob.type];
  if(t.passive)mob.flee=3;
  // Knockback
  var kbx=mob.x-P.x,kbz=mob.z-P.z,kbl=sq(kbx*kbx+kbz*kbz);
  if(kbl>.1){mob.x+=kbx/kbl*.5;mob.z+=kbz/kbl*.5;}

    mob.dead=1;mob.dt=.6;showA(t.n+' 被击杀！');
    addXP(t.passive?1:5);
    if(t.drop){for(var di=0;di<t.drop.length;di++){var dr=t.drop[di];if(dr[0])spDrop(mob.x,mob.y+.5,mob.z,dr[0],dr[1]);}}
  }
}

  var passive=['pig','cow','sheep','chicken'];

    var mx2=P.x+sin(ang2)*dist2,mz=P.z+cos(ang2)*dist2;

    if(b.n.indexOf('头盔')>=0){ctx.fillRect(8,8,24,6);ctx.fillRect(6,14,28,12);ctx.fillRect(10,14,6,4);ctx.fillRect(24,14,6,4);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(12,18,6,6);ctx.fillRect(22,18,6,6);}

    else if(b.n.indexOf('护腿')>=0){ctx.fillRect(8,4,24,8);ctx.fillRect(8,12,10,22);ctx.fillRect(22,12,10,22);ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(18,4,4,30);}
    else{ctx.fillRect(6,12,12,18);ctx.fillRect(22,12,12,18);ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(8,16,8,4);ctx.fillRect(24,16,8,4);}
    // Shine
    ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(10,6,6,4);
    itemCache[id]=cv;return cv;
  }
  // Non-block items (materials etc): draw flat colored square with border
  if(b.nb){
    var col=b.c.t,mr=(col>>16)&255,mg=(col>>8)&255,mb=col&255;
    ctx.fillStyle='rgb('+fl(mr*.8)+','+fl(mg*.8)+','+fl(mb*.8)+')';ctx.fillRect(8,8,24,24);
    ctx.fillStyle='rgb('+mr+','+mg+','+mb+')';ctx.fillRect(10,10,20,20);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(10,10,20,3);ctx.fillRect(10,10,3,20);
    itemCache[id]=cv;return cv;
  }
  // Flowers/foliage: draw stem + petals
  if(b.f){
    var col=b.c.t,pr=(col>>16)&255,pg=(col>>8)&255,pb=col&255;
    ctx.fillStyle='#3a8a2a';ctx.fillRect(18,20,4,16); // stem
    ctx.fillStyle='rgb('+pr+','+pg+','+pb+')';
    ctx.beginPath();ctx.ellipse(20,14,8,8,0,0,PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.ellipse(18,12,3,3,0,0,PI*2);ctx.fill();
    itemCache[id]=cv;return cv;
  }
  // Block items: isometric 3D cube
  var u=13,cx2=20,cy2=19;
  // Top face
  ctx.save();ctx.setTransform(u/16,u/32,-u/16,u/32,cx2,cy2-u);
  ctx.drawImage(topT||sideT,0,0);ctx.restore();
  // Right face
  ctx.save();ctx.setTransform(u/16,-u/32,0,u/16,cx2,cy2);
  ctx.drawImage(sideT||topT,0,0);ctx.restore();
  // Left face
  ctx.save();ctx.setTransform(u/16,u/32,0,u/16,cx2-u,cy2-u/2);
  ctx.drawImage(sideT||topT,0,0);ctx.restore();
  // Shading
  ctx.beginPath();ctx.moveTo(cx2-u,cy2-u/2);ctx.lineTo(cx2,cy2);ctx.lineTo(cx2,cy2+u);ctx.lineTo(cx2-u,cy2+u/2);
  ctx.closePath();ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fill();
  ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(cx2+u,cy2-u/2);ctx.lineTo(cx2+u,cy2+u/2);ctx.lineTo(cx2,cy2+u);
  ctx.closePath();ctx.fillStyle='rgba(0,0,0,0.08)';ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(cx2,cy2-u);ctx.lineTo(cx2+u,cy2-u/2);ctx.lineTo(cx2+u,cy2+u/2);ctx.lineTo(cx2,cy2+u);ctx.lineTo(cx2-u,cy2+u/2);ctx.lineTo(cx2-u,cy2-u/2);ctx.closePath();ctx.stroke();
  itemCache[id]=cv;return cv;
}

function updDayNight(dt){
  TOD=(TOD+dt/DAY_LEN)%1;
  var angle=(TOD-.25)*PI*2;
  var sunY=sin(angle)*120,sunX=cos(angle)*80;
  sun.position.set(P.x+sunX,ab(sunY)+10,P.z+60);
  sun.target.position.set(P.x,P.y,P.z);
  var dayF=mx(0,mn(1,(sin(angle)+.2)*1.2));
  // Night minimum brightness: ambient 0.25, hemi 0.15
  sun.intensity=dayF*1.2;
  ambL.intensity=.25+dayF*.35;
  hemiL.intensity=.15+dayF*.25;
  // Sky color: night is dark blue not black
  var skyR=.04+dayF*.49,skyG=.04+dayF*.73,skyB=.12+dayF*.8;
  var nightB=1-dayF;
  skyR+=nightB*.02;skyG+=nightB*.02;skyB+=nightB*.08;
  scene.background.setRGB(skyR,skyG,skyB);scene.fog.color.setRGB(skyR,skyG,skyB);
  if(ab(TOD-.25)<.06||ab(TOD-.75)<.06)sun.color.setHex(0xff8844);
  else sun.color.setHex(0xfff0e0);
  // Sun visual position (follows the light but visible in sky)
  var svx=P.x+cos(angle)*160,svy=sin(angle)*160,svz=P.z+60;
  sunVis.position.set(svx,svy,svz);
  sunGlow.position.set(svx,svy,svz);
  sunVis.visible=svy>-10;
  sunGlow.visible=svy>-10;
  // Moon opposite side of sun
  var mvx=P.x-cos(angle)*160,mvy=-sin(angle)*160,mvz=P.z+60;
  moonVis.position.set(mvx,mvy,mvz);
  moonGlow.position.set(mvx,mvy,mvz);
  moonVis.visible=mvy>-10;
  moonGlow.visible=mvy>-10;
}

// ======================= HUNGER =======================
var hungerT=0,regenT=0,starveT=0,healOT=0,healOV=0;
function updHungerSys(dt){
  if(P.gm===1)return; // Creative: no hunger
  // Hunger drain: every 30s normally, faster when sprinting
  hungerT+=dt;if(P.sprint&&P.gnd)hungerT+=dt*1.5;
  if(hungerT>=30){hungerT=0;
    if(P.hunger>0){P.hunger=mx(0,P.hunger-1);updHunger2();}
  }
  // Starvation: when hunger=0, lose 1HP every 4s
  if(P.hunger<=0){starveT+=dt;if(starveT>=4){starveT=0;P.hp=mx(0,P.hp-1);updHP();dmgFlash();if(P.hp<=0)die();}}
  else starveT=0;
  // Natural regen: when hunger>=18, heal 1HP every 3s
  if(P.hunger>=18&&P.hp<P.maxHp){regenT+=dt;if(regenT>=3){regenT=0;P.hp=mn(P.maxHp,P.hp+1);updHP();}}
  else regenT=0;
  // Heal over time from eating
  if(healOV>0){healOT+=dt;if(healOT>=1.5){healOT=0;healOV--;P.hp=mn(P.maxHp,P.hp+1);updHP();}}
}
function eat(fv){
  P.hunger=mn(20,P.hunger+fv);updHunger2();
  healOV+=fl(fv/2);if(healOV>10)healOV=10;healOT=0;
  showA('+'+fv+' 饥饿值');
}

// ======================= XP =======================
function addXP(n){
  P.xp+=n;
  while(P.xp>=P.xpNext){P.xp-=P.xpNext;P.level++;P.xpNext=fl(7+P.level*2.5);showA('升级！等级 '+P.level);}
  updXP();
}

// ======================= DAMAGE =======================
function dmgFlash(){$('dmg').style.borderColor='rgba(200,0,0,.4)';setTimeout(function(){$('dmg').style.borderColor='transparent';},200);}
function hurtP(n,src,kbx,kbz){
  if(P.dead||P.gm===1)return; // Creative: immune to damage
  P.hp=mx(0,P.hp-n);updHP();dmgFlash();
  if(src)showA(src+' -'+n);
  // Knockback: push player away from damage source
  if(kbx!==undefined&&kbz!==undefined){
    var kbl=sq(kbx*kbx+kbz*kbz);
    if(kbl>.01){P.vx=kbx/kbl*12;P.vz=kbz/kbl*12;P.vy=5;}
  }
  if(P.hp<=0)die();
}
function die(){if(P.gm===1)return;P.dead=true;$('die').style.display='flex';document.exitPointerLock();}
function RESPAWN(){
  P.hp=20;P.hunger=20;P.xp=0;P.level=0;P.xpNext=7;P.dead=false;

var keys={},mDown=0,locked=false;
document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code.startsWith('Digit')&&e.code!=='Digit0'){P.sel=+e.code[5]-1;updHB();}
  if(e.code==='KeyE'&&locked){e.preventDefault();togInv();}
  // C key removed: 3x3 crafting only via right-click workbench block
  if(e.code==='KeyF'&&locked&&P.gm===1){P.fly=!P.fly;P.vy=0;showA(P.fly?'飞行模式':'步行模式');}
  if(e.code==='F3'){e.preventDefault();var u=$('ui');u.style.display=u.style.display==='none'?'block':'none';}
  if(e.code==='F4'){e.preventDefault();P.viewMode=(P.viewMode+1)%3;showA(['第一人称','第三人称(后)','第三人称(前)'][P.viewMode]);pModel.visible=P.viewMode!==0;}
  if(e.code==='KeyQ'&&locked){
    var it=P.hb[P.sel];if(it){spDrop(P.x+sin(P.ry)*1.5,P.y+1.2,P.z+cos(P.ry)*1.5,it.id,1);
    if(P.gm!==1){it.q--;if(it.q<=0)P.hb[P.sel]=null;}updHB();}
  }
});

document.addEventListener('mousemove',function(e){
  if(!locked||P.dead)return;
  P.ry-=e.movementX*.002;P.rx-=e.movementY*.002;
  P.rx=mx(-PI/2+.01,mn(PI/2-.01,P.rx));
});
document.addEventListener('mousedown',function(e){if(locked)mDown=e.button===0?1:e.button===2?2:0;});
document.addEventListener('mouseup',function(e){if((e.button===0&&mDown===1)||(e.button===2&&mDown===2))mDown=0;P.mineT=0;P.mineB=null;});
document.addEventListener('wheel',function(e){P.sel=(P.sel+(e.deltaY>0?1:-1)+9)%9;updHB();});
ren.domElement.addEventListener('click',function(){if(!locked&&!invOpen&&!craftOpen&&!P.dead)ren.domElement.requestPointerLock();});

// ======================= RAYCASTING =======================
function raycast(ox,oy,oz,dx,dy,dz,maxD){
  var x=fl(ox),y=fl(oy),z=fl(oz);
  var sx=dx>0?1:-1,sy=dy>0?1:-1,sz=dz>0?1:-1;
  var dtx=ab(1/dx),dty=ab(1/dy),dtz=ab(1/dz);
  var tmx=(dx>0?(x+1-ox):(ox-x))*dtx;
  var tmy=(dy>0?(y+1-oy):(oy-y))*dty;
  var tmz=(dz>0?(z+1-oz):(oz-z))*dtz;
  var face=0;
  for(var i=0;i<maxD*3;i++){
    var bid=gB(x,y,z);
    if(bid>0&&!B[bid].nb&&!B[bid].t){return{x:x,y:y,z:z,id:bid,face:face};}
    if(bid>0&&!B[bid].nb&&B[bid].t&&bid!==120&&bid!==121){return{x:x,y:y,z:z,id:bid,face:face};}
    if(tmx<tmy&&tmx<tmz){tmx+=dtx;x+=sx;face=sx>0?4:5;}
    else if(tmy<tmz){tmy+=dty;y+=sy;face=sy>0?2:3;}
    else{tmz+=dtz;z+=sz;face=sz>0?0:1;}
  }
  return null;
}
function faceOff(f){return f===0?[0,0,-1]:f===1?[0,0,1]:f===2?[0,-1,0]:f===3?[0,1,0]:f===4?[-1,0,0]:[1,0,0];}

// ======================= PHYSICS =======================
function AABB(ax,ay,az,hw,hh){
  for(var bx=fl(ax-hw);bx<=fl(ax+hw);bx++)
    for(var by=fl(ay);by<=fl(ay+hh);by++)
      for(var bz=fl(az-hw);bz<=fl(az+hw);bz++){
        var b=gB(bx,by,bz);if(b>0&&!B[b].t&&!B[b].nb)return true;
      }
  return false;
}
function updPhysics(dt){
  if(P.dead)return;
  // Crouch
  P.crouch=!P.fly&&(keys['ShiftLeft']||keys['ShiftRight']);
  var eyeH=P.crouch?1.32:1.62;
  var pHeight=P.crouch?1.4:1.7;
  var sp=P.crouch?2.2:P.sprint?6.2:4.3;if(P.fly)sp=12;
  var mv=dt*sp,sx2=sin(P.ry),cx2=cos(P.ry),dx=0,dz=0;
  if(keys['KeyW']){dx-=sx2;dz-=cx2;}
  if(keys['KeyS']){dx+=sx2;dz+=cx2;}
  if(keys['KeyA']){dx-=cx2;dz+=sx2;}
  if(keys['KeyD']){dx+=cx2;dz-=sx2;}
  P.sprint=!P.crouch&&(keys['ControlLeft']||keys['ControlRight']);
  var len=sq(dx*dx+dz*dz);if(len>.01){dx/=len;dz/=len;}
  if(P.fly){
    // Flying: no collision, pass through blocks
    P.x+=dx*mv;P.z+=dz*mv;
  }else{
    var nx=P.x+dx*mv;if(!AABB(nx,P.y,P.z,.28,pHeight))P.x=nx;
    var nz=P.z+dz*mv;if(!AABB(P.x,P.y,nz,.28,pHeight))P.z=nz;
  }
  // Apply knockback velocity directly to position
  if(P.vx||P.vz){
    var kx=P.vx*dt,kz=P.vz*dt;
    if(!P.fly){
      var knx=P.x+kx;if(!AABB(knx,P.y,P.z,.28,pHeight))P.x=knx; else P.vx=0;
      var knz=P.z+kz;if(!AABB(P.x,P.y,knz,.28,pHeight))P.z=knz; else P.vz=0;
    }else{P.x+=kx;P.z+=kz;}
    P.vx*=.88;P.vz*=.88;
    if(ab(P.vx)<.05)P.vx=0;if(ab(P.vz)<.05)P.vz=0;
  }
  if(P.fly){
    P.vy=0;
    if(keys['Space'])P.y+=dt*8;
    if(keys['ShiftLeft']||keys['ShiftRight'])P.y-=dt*8;
    P.gnd=false;P.fallY=P.y;
  }else{
    P.vy-=28*dt;
    if(keys['Space']&&P.gnd){P.vy=8.5;P.gnd=false;}
    var inW=gB(fl(P.x),fl(P.y+.8),fl(P.z))===120;
    if(inW){P.vy=mx(P.vy,-2);if(keys['Space'])P.vy=4;P.fallY=P.y;}
    var ny=P.y+P.vy*dt;
    if(P.vy<0&&AABB(P.x,ny,P.z,.28,.01)){
      if(!P.gnd){var fd=P.fallY-P.y;if(fd>3.5&&!inW){var dmg=fl(fd-3);hurtP(dmg);showA('摔落伤害 -'+dmg);}}
      P.vy=0;P.gnd=true;P.fallY=P.y;
    }else if(P.vy>0&&AABB(P.x,ny+pHeight,P.z,.28,.01)){P.vy=0;P.y=ny;}
    else{P.y=ny;P.gnd=false;}
  }
  P.x=mx(.5,mn(WS-.5,P.x));P.z=mx(.5,mn(WS-.5,P.z));
  if(P.y<-5){if(P.gm===1){P.y=fGnd(fl(P.x),fl(P.z))+2;P.vy=0;}else hurtP(100);}
  // Walk animation
  var moving=len>.01&&P.gnd;
  if(moving)P.wa+=dt*(P.sprint?8:5);else P.wa*=.85;
  // Camera modes
  if(P.viewMode===0){
    cam.position.set(P.x,P.y+eyeH,P.z);
    cam.rotation.order='YXZ';cam.rotation.y=P.ry;cam.rotation.x=P.rx;
  }else{
    var camDist=P.viewMode===1?4:4;
    var cDir=P.viewMode===1?1:-1;
    var camX=P.x+sin(P.ry)*camDist*cDir*cos(P.rx);
    var camY=P.y+eyeH-sin(P.rx)*camDist*cDir;
    var camZ=P.z+cos(P.ry)*camDist*cDir*cos(P.rx);
    // Simple collision check for camera
    for(var ci=0;ci<10;ci++){
      var t=ci/10;
      var tx=P.x+sin(P.ry)*camDist*t*cDir*cos(P.rx);
      var ty=P.y+eyeH-sin(P.rx)*camDist*t*cDir;
      var tz=P.z+cos(P.ry)*camDist*t*cDir*cos(P.rx);
      if(gB(fl(tx),fl(ty),fl(tz))>0){camDist=camDist*mx(.5,t-.1);
        camX=P.x+sin(P.ry)*camDist*cDir*cos(P.rx);
        camY=P.y+eyeH-sin(P.rx)*camDist*cDir;
        camZ=P.z+cos(P.ry)*camDist*cDir*cos(P.rx);break;}
    }
    cam.position.set(camX,camY,camZ);
    cam.lookAt(P.x,P.y+eyeH-.3,P.z);
  }
  // Update player model
  pModel.position.set(P.x,P.y,P.z);pModel.rotation.y=P.ry+PI;
  var crouchOff=P.crouch?-.3:0;
  pHead.position.y=1.5+crouchOff;pBody.position.y=.87+crouchOff;
  pArmL.position.y=.87+crouchOff;pArmR.position.y=.87+crouchOff;
  pHandL.position.y=.54+crouchOff;pHandR.position.y=.54+crouchOff;
  pHair.position.y=1.62+crouchOff;
  pEyeL.position.y=1.5+crouchOff;pEyeR.position.y=1.5+crouchOff;
  pPupL.position.y=1.5+crouchOff;pPupR.position.y=1.5+crouchOff;
  if(P.crouch){pBody.rotation.x=.3;pHead.rotation.x=-.3;}
  else{pBody.rotation.x=0;pHead.rotation.x=P.rx*.3;}
  var la=sin(P.wa)*.6;
  pLegL.rotation.x=la;pLegR.rotation.x=-la;
  pArmL.rotation.x=-la*.5;
  // Right arm: swing animation overrides walk
  if(swingT>0){
    swingT-=dt;var sp2=1-swingT/swingDur;
    pArmR.rotation.x=-2.0*sin(sp2*PI);pArmR.rotation.z=-.3*sin(sp2*PI);
    fpSwingAng=sin(sp2*PI)*1.2;
  }else{pArmR.rotation.x=la*.5;pArmR.rotation.z=0;fpSwingAng*=.8;if(ab(fpSwingAng)<.01)fpSwingAng=0;}
  pModel.visible=P.viewMode!==0;
  // First-person hand position (bottom-right of screen)
  if(P.viewMode===0){
    fpHand.visible=true;
    var fsx=sin(P.ry),fcx=cos(P.ry);
    var frx=cos(P.rx),fry=sin(P.rx);
    var eyeH2=P.crouch?1.32:1.62;
    // Hand position: right side and slightly below eye level, in front
    var hDist=0.55,hRight=0.4,hDown=0.35;
    fpHand.position.set(
      P.x + (-fcx)*hRight + (-fsx)*hDist,
      P.y + eyeH2 - hDown + fry*(-0.2),
      P.z + (fsx)*hRight + (-fcx)*hDist
    );
    fpHand.rotation.set(-P.rx-0.5-fpSwingAng, P.ry+PI, 0, 'YXZ');
    // Idle bob
    var bob=sin(P.wa*.5)*.01;
    fpHand.position.y+=bob;
  }else{fpHand.visible=false;}
}

// ======================= MINE / PLACE / ATTACK =======================
var breakSpd={0:1.2,1:.4,2:.2,3:.12,4:.06};
var atkCD=0;
function updAction(dt){
  if(P.dead||invOpen||craftOpen)return;
  if(atkCD>0)atkCD-=dt;
  var eyeH=P.crouch?1.32:1.62;
  var adx=-sin(P.ry)*cos(P.rx),ady=sin(P.rx),adz=-cos(P.ry)*cos(P.rx);
  var hit=raycast(P.x,P.y+eyeH,P.z,adx,ady,adz,6);
  if(hit){
    hlBox.position.set(hit.x+.5,hit.y+.5,hit.z+.5);hlBox.visible=true;
    if(mDown===1){
      if(P.gm===1){
        // Creative: instant break, no drops needed
        mDown=0;swingT=swingDur;
        spawnBreakParts(hit.x,hit.y,hit.z,hit.id);
        sB(hit.x,hit.y,hit.z,0);rebld(hit.x,hit.z);
      }else{
        if(!P.mineB||P.mineB.x!==hit.x||P.mineB.y!==hit.y||P.mineB.z!==hit.z){P.mineT=0;P.mineB={x:hit.x,y:hit.y,z:hit.z};}
        if(swingT<=0)swingT=swingDur; // continuous swing while mining
        var tl=P.hb[P.sel]?P.hb[P.sel].id:0;
        var toolLv=B[tl]?B[tl].tool:0;
        var isPick=toolLv>=1&&toolLv<=4;
        var spd=breakSpd[isPick?toolLv:0]||1.2;
        if(hit.id===12)spd=999;
        P.mineT+=dt;
        // Crack overlay
        var stage=mn(4,fl(P.mineT/spd*5));
        crackBox.material=crackMats[stage];
        crackBox.position.set(hit.x+.5,hit.y+.5,hit.z+.5);crackBox.visible=true;
        if(P.mineT>=spd){
          P.mineT=0;crackBox.visible=false;
          spawnBreakParts(hit.x,hit.y,hit.z,hit.id);
          var dropId=BD[hit.id]!==undefined?BD[hit.id]:hit.id;
          if(dropId>0)spDrop(hit.x+.5,hit.y+.5,hit.z+.5,dropId,1);
          sB(hit.x,hit.y,hit.z,0);rebld(hit.x,hit.z);addXP(1);
        }
      }
    }else{crackBox.visible=false;}
    if(mDown===2){
      mDown=0;
      // Interact with crafting table
      if(hit.id===49){togCraft();return;}
      var fo=faceOff(hit.face);
      var px2=hit.x+fo[0],py2=hit.y+fo[1],pz2=hit.z+fo[2];
      var it=P.hb[P.sel];
      if(it&&B[it.id]&&!B[it.id].nb&&!B[it.id].food){
        if(!(fl(P.x)===px2&&(fl(P.y)===py2||fl(P.y+1)===py2)&&fl(P.z)===pz2)){
          sB(px2,py2,pz2,it.id);rebld(px2,pz2);
          if(P.gm!==1){it.q--;if(it.q<=0)P.hb[P.sel]=null;}
          updHB();
        }
      }
      if(it&&B[it.id]&&B[it.id].food>0&&P.hunger<20){
        eat(B[it.id].food);
        if(P.gm!==1){it.q--;if(it.q<=0)P.hb[P.sel]=null;}
        updHB();
      }
    }
  }else{hlBox.visible=false;crackBox.visible=false;P.mineT=0;P.mineB=null;}
  // Melee attack
  if(mDown===1&&atkCD<=0){
    var tl2=P.hb[P.sel]?B[P.hb[P.sel].id]:null;
    var hasTool=tl2&&tl2.tool>=5;
    var aDmg=hasTool?tl2.tool-4:0.5;
    for(var i=0;i<mobs.length;i++){
      var m=mobs[i];if(m.dead)continue;
      var md=sq((m.x-P.x)*(m.x-P.x)+(m.y+.8-P.y-1.5)*(m.y+.8-P.y-1.5)+(m.z-P.z)*(m.z-P.z));
      if(md<3){
        var toM=Math.atan2(-(m.x-P.x),-(m.z-P.z));
        var ang=ab(((toM-P.ry)%(PI*2)+PI*3)%(PI*2)-PI);
        if(ang<PI/3){hitMob(m,aDmg);atkCD=.4;swingT=swingDur;break;}
      }
    }
  }
}

// ======================= DEBUG =======================
function updDebug(){
  $('ui').innerHTML='XYZ: '+P.x.toFixed(1)+' '+P.y.toFixed(1)+' '+P.z.toFixed(1)+
    '<br>Chunk: '+fl(P.x/CS)+','+fl(P.z/CS)+
    '<br>FPS: '+fps+' | Mobs: '+mobs.length+
    '<br>Biome: '+getBiome(fl(P.x),fl(P.z))+
    '<br>Time: '+fl(TOD*24000)+' | '+(WTH.rain?'雨':'晴')+
    '<br>Fly: '+(P.fly?'ON':'OFF')+' | Lv: '+P.level;
}

// ======================= CHUNK MANAGEMENT =======================
function updChunks(){
  var cx=fl(P.x/CS),cz=fl(P.z/CS);
  for(var dx=-RD;dx<=RD;dx++)for(var dz=-RD;dz<=RD;dz++){
    if(dx*dx+dz*dz>RD*RD+2)continue;
    var nx=cx+dx,nz=cz+dz,key=ckKey(nx,nz);
    if(nx>=0&&nz>=0&&nx<WS/CS&&nz<WS/CS&&!CK[key])bldCk(nx,nz);
  }
}

// ======================= MAIN LOOP =======================
var prevT=0,fps=0,fpsT=0,fpsC=0;
function gameLoop(t){
  requestAnimationFrame(gameLoop);
  var dt=mn(.05,(t-prevT)/1000);prevT=t;
  fpsC++;fpsT+=dt;if(fpsT>=1){fps=fpsC;fpsC=0;fpsT=0;}
  if(P.dead){ren.render(scene,cam);return;}
  updPhysics(dt);updAction(dt);
  updMobs(dt);updArr(dt);updBoom(dt);updDrops(dt);updParticles(dt);
  updDayNight(dt);updWeather(dt);updHungerSys(dt);
  mobResp(dt);
  // Update mob HP bars to face camera
  for(var mi=0;mi<mobs.length;mi++){if(mobs[mi].hpBar&&mobs[mi].hpBar.sp.visible)mobs[mi].hpBar.sp.lookAt(cam.position);}
  if(fpsC%30===0)updChunks();
  if($('ui').style.display!=='none'&&fpsC%15===0)updDebug();
  ren.render(scene,cam);
}

// ======================= INIT =======================
async function init(){
  $('ltxt').textContent='生成地形...';$('lfill').style.width='10%';
  await new Promise(function(r){setTimeout(r,50);});
  var total=fl(WS/CS)*fl(WS/CS),done=0;
  for(var cx2=0;cx2<fl(WS/CS);cx2++)for(var cz2=0;cz2<fl(WS/CS);cz2++){
    genChunkTerrain(cx2,cz2);genTrees(cx2,cz2);done++;
    if(done%20===0){$('lfill').style.width=(10+done/total*40)+'%';await new Promise(function(r){setTimeout(r,1);});}
  }
  $('ltxt').textContent='构建区块...';$('lfill').style.width='50%';
  await bldInitCk();
  $('ltxt').textContent='生成生物...';$('lfill').style.width='90%';
  spawnMobs();
  P.y=fGnd(fl(P.x),fl(P.z))+2;P.fallY=P.y;
  bldHB();updHP();updHunger2();updXP();initCraft();
  $('ltxt').textContent='完成！';$('lfill').style.width='100%';
  await new Promise(function(r){setTimeout(r,300);});
  $('load').style.display='none';
  ren.domElement.requestPointerLock();
  requestAnimationFrame(gameLoop);
}
window.addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
// ======================= GAME MODE =======================
function startGame(mode){
  P.gm=mode;
  $('modesel').style.display='none';
  $('load').style.display='flex';
  if(mode===1){
    // Creative: fly by default, hide survival UI
    P.fly=true;
    $('hp').style.display='none';
    $('hunger').style.display='none';
    $('xpbar').style.display='none';
    $('xplvl').style.display='none';
    $('help').innerHTML='WASD移动 空格上升 Shift下降<br>左键破坏 右键放置 滚轮/1-9选<br>E背包(所有方块) F4视角<br>Q丢弃 无敌 无限方块 自由飞行';
  }else{
    $('help').innerHTML='WASD移动 空格跳 Ctrl冲刺 Shift蹲<br>左键挖/攻 右键放/吃 滚轮/1-9选<br>E背包(2x2合成) 右键工作台(3x3)<br>F4视角 Q丢弃 需挖掘收集方块';
  }
  init();
}
